<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
    <meta name="theme-color" content="#0a0a0a" />
    <!-- dark from the first frame (no white flash before the stylesheet arrives) -->
    <style>
      html, body { background: #0a0a0a; color-scheme: dark; margin: 0; }
      /* The opening: four outlined tiles, and a fill that moves clockwise from tile to tile (top, right,
         bottom, left), one at a time. Pure CSS, outside the app, so it starts with the first frame and stays
         smooth while the app loads underneath; the app fades it out (App.tsx) after a full lap, once ready. */
      #splash { position: fixed; inset: 0; z-index: 60; display: grid; place-items: center; background: #0a0a0a; transition: opacity 0.4s ease-out; }
      #splash.gone { opacity: 0; pointer-events: none; }
      .mark { position: relative; width: 90px; height: 90px; color: #e8875f; }
      .mark i { position: absolute; left: 31.6px; top: 31.6px; width: 26.8px; height: 26.8px; transform: translate(var(--x), var(--y)); }
      .mark i::before, .mark i::after { content: ''; position: absolute; inset: 0; box-sizing: border-box; border-radius: 7.4px; transform: rotate(45deg); }
      .mark i::before { border: 4.9px solid currentColor; }
      .mark i::after { background: currentColor; opacity: 0; animation: tile-fill 1.6s linear infinite both; animation-delay: calc(0.3s + var(--n) * 0.4s); }
      .mark i:nth-of-type(1) { --x: 0px; --y: -22.5px; --n: 0; }
      .mark i:nth-of-type(2) { --x: 22.5px; --y: 0px; --n: 1; }
      .mark i:nth-of-type(3) { --x: 0px; --y: 22.5px; --n: 2; }
      .mark i:nth-of-type(4) { --x: -22.5px; --y: 0px; --n: 3; }
      /* each tile holds the fill for a quarter of the lap, handing it on with a short fade */
      @keyframes tile-fill { 0% { opacity: 0; } 4% { opacity: 1; } 23% { opacity: 1; } 27% { opacity: 0; } 100% { opacity: 0; } }
      @media (prefers-reduced-motion: reduce) { .mark i::after { animation: none; } }
    </style>
    <!-- the 3D card's model and picture start downloading with the page -->
    <link rel="preload" href="/models/card.glb" as="fetch" type="model/gltf-binary" crossorigin />
    <link rel="preload" href="/models/holo-claude.jpg" as="image" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Tessera</title>
    <!-- deferred: still runs before the app (scripts keep their order), but no longer blocks the first paint -->
    <script src="https://telegram.org/js/telegram-web-app.js" defer></script>
  </head>
  <body>
    <!-- the opening logo (styles above); App.tsx fades it out after a full lap, once the app is ready -->
    <div id="splash" aria-label="Tessera"><div class="mark"><i></i><i></i><i></i><i></i></div></div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
